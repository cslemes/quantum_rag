services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./results:/app/results
      - ./bench:/app/bench
      - ./src:/app/src
      - ./scripts:/app/scripts
    # Ollama runs on the host, not as a compose service (see research.md's
    # "Ambiente de execução canônico" note): it's already benchmarked there
    # at 100% GPU / 492 tok/s prefill (D10), a containerized instance would
    # fight it for port 11434 and re-download the model weights into a
    # separate volume, and OLLAMA_BASE_URL in .env points at
    # host.docker.internal instead of a service name.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["sleep", "infinity"] # driven interactively via `make` targets

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qdrant_storage:
