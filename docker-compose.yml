services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      qdrant:
        condition: service_healthy
    # research.md D18b — the embedding models are baked into the image at their
    # pinned revisions (Dockerfile, FASTEMBED_CACHE_PATH=/opt/fastembed). This
    # replaced D18's named `fastembed_cache` volume: a volume made the download
    # a first-run cost, but a fresh volume still needed huggingface.co at
    # runtime. Do not mount anything over /opt/fastembed.
    # US6 (T105): the interface is served from this container, so the port has
    # to leave it — the browser is outside. Bound to 0.0.0.0 inside the
    # container on purpose; publishing alone is not enough if the server
    # listens only on 127.0.0.1.
    #
    # NOTE for the sandboxed dev environment: publishing here exposes the port
    # to the Docker host, not to a browser outside the sandbox. Reaching it
    # from the host machine additionally needs `sbx ports <sandbox> --publish
    # 8000:8000/tcp` run OUTSIDE the sandbox.
    ports:
      - "8000:8000"
    environment:
      # `localhost` inside this container is the container, not the host, so
      # .env's QDRANT_URL cannot work here. The compose network resolves the
      # service name. Overrides env_file, which is loaded first.
      QDRANT_URL: http://qdrant:6333
    volumes:
      # The whole project, so what is edited on the host is what the container
      # serves — no rebuild to see a change. Safe because the virtualenv lives
      # at /opt/venv (UV_PROJECT_ENVIRONMENT), outside /app, so this mount
      # cannot shadow it. Do NOT mount anything over /opt/fastembed (D18b).
      - .:/app
    # Ollama runs on the host, not as a compose service (see research.md's
    # "Ambiente de execução canônico" note): it's already benchmarked there
    # at 100% GPU / 492 tok/s prefill (D10), a containerized instance would
    # fight it for port 11434 and re-download the model weights into a
    # separate volume, and OLLAMA_BASE_URL in .env points at
    # host.docker.internal instead of a service name.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Serves the interface (US6). This replaced `sleep infinity`, which meant
    # the service existed only to be exec'd into — and left `docker compose up
    # app` serving nothing, so the container path was never actually used
    # (F21). A demo that depends on a dev session being alive is too fragile
    # to hand to someone else.
    #
    # The make targets still work, because exec does not care what PID 1 is:
    #   docker compose exec app make eval
    #   docker compose exec app make index
    command: ["uvicorn", "qcagent.ui.app:app", "--host", "0.0.0.0", "--port", "8000"]

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qdrant_storage:
