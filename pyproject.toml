[project]
name = "qcagent"
version = "0.1.0"
description = "Sintese verificada de circuitos quanticos assistida por IA"
requires-python = "==3.11.*"
readme = "reference.md"
license = { text = "Apache-2.0" }

dependencies = [
    "qiskit==1.2.4",
    "qiskit-aer==0.15.1",
    "pennylane>=0.38,<0.39",
    # pinned: pennylane==0.38 declares autoray>=0.6.11 with no upper bound,
    # but autoray>=0.7 removed `NumpyMimic`, which pennylane.math imports at
    # module load time. 0.6.11 is the newest version that still has it.
    "autoray==0.6.11",
    "langgraph>=0.2,<0.3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "qdrant-client>=1.12,<1.13",
    "fastembed>=0.3,<0.4",
    "anthropic>=0.34,<1",
    "httpx>=0.27,<1",
    "tenacity>=8.5,<9",
    "structlog>=24.4,<25",
    "numpy>=1.26,<2",
    "scipy>=1.13,<2",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.0,<7",
]

[project.optional-dependencies]
gpu = ["qiskit-aer-gpu==0.15.1"]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "pre-commit>=3.8,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qcagent"]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "pre-commit>=3.8,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: benchmarks that require real hardware (GPU) and are skipped by default",
]
addopts = "-ra -m 'not smoke'"

[tool.ruff]
line-length = 100
target-version = "py311"
# Scoped to actual code — NOT `specs/`. ruff format reformats fenced Python
# code blocks inside .md files by default, and specs/ holds hand-authored
# contract/spec documents where that's an unwanted side effect, not a fix.
include = [
    "src/**/*.py",
    "bench/**/*.py",
    "analysis/**/*.py",
    "tests/**/*.py",
    "scripts/**/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
