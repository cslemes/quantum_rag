# Canonical execution environment — the PINNED values the runner checks at
# startup (item "version gating"; report-notes.md, "ambiente canônico").
#
# A field here is enforced or labeled, never decoration (F21):
#   (Ollama's expected server version moved to the PROFILE of the backend,
#   generator_profiles.yaml `expected_server_version`: the host and the pod pin
#   different versions, and a global pin would force an override on a correct
#   run. The runner still ABORTS on a mismatch, naming both versions; an
#   overridden run carries `ollama_version_gate: OVERRIDDEN ...`.)
#   gpu_model       DECLARED, not verifiable: Ollama's HTTP API exposes no
#                   device name, and nvidia-smi lives on the host. The runner
#                   records the operator's declaration (QCAGENT_GPU_MODEL) and
#                   aborts only if a declaration contradicts this value; an
#                   absent declaration is recorded as "unrecorded".
#
# Moving a backend to another server version is a deliberate act: change its
# `expected_server_version` in generator_profiles.yaml, in the same commit, and say why in report-notes.md.
gpu_model: "NVIDIA GeForce RTX 3070 (8 GB)"   # as declared in plan.md, host Windows
