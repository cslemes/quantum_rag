# OpenAI arm L2 (T114 subset, seed 1), gpt-6-luna via api.openai.com. L1 and L2 are IDENTICAL on purpose: their difference is the arm's noise floor. L0 = reasoning none (off).
# REGISTRADA — corpus na versão fixada"). NOT the regression suite: 16 tasks in
# two strata, chosen from run 99960870239e97e7 before any arm ran.
#   Stratum A — errors taught by the 2.x corpus (F24)
#   Stratum B — invented symbols only (F25); control for S0->S1
model: gpt-6-luna
provider: openai
seeds: [1]
tasks:
  # A
  - dj_constant_4q
  - dj_constant_4q_perturbed
  - dj_balanced_4q
  - simon_6q_perturbed
  - grover_3q
  - grover_4q
  - ising_weighted_maxcut_4q
  - ising_field_coupling_4q_perturbed
  # B
  - bell_phi_plus_2q
  - ghz_5q
  - qft_5q
  - w_state_5q
  - qpe_4q
  - bv_4q
  - reversible_half_adder_4q
  - qaoa_maxcut_4q_perturbed
max_iter: 5
results_dir: results

# Fronteira B arm (S-B), OpenRouter. GPT-6 Luna is the SMALL tier of GPT-6
# ("positioned below GPT-6 Sol"), chosen for cost; switching to
# openai/gpt-6-sol-pro is this one line. Like the frontier arm (S-F): same 16 tasks, same corpus, validators, routing and
# corrector as S2; only the LLM differs, in every role (planner, generator,
# critic). The API is not deterministic, so the three seeds are three genuine
# samples here, not copies — and the reset/canary, which are properties of the
# local Ollama server (F28), do not apply and are turned off explicitly.
reset_per_run: false
protocol_canary: []
reasoning_effort: high
