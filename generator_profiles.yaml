# Generator backend profiles — the ONE place a generator is described.
#
# A profile is configuration over a single code path: the UI, the regression
# runner and the by-hand tools all build their client from it with
# `qcagent.llm.profiles.build_client`. Adding a backend is adding an entry
# here, not adding code — provided its protocol is one of the client types
# (`ollama`, `openai_compatible`).
#
# SECRETS never appear in this file. `credential_env` names an environment
# variable (resolved server-side from the process environment or .env); the
# loader rejects anything that is not shaped like a variable name. Neither the
# UI, the run records nor the logs ever carry the value.
#
# The app does NOT start, stop or provision anything. A profile whose backend
# is not up is reported as unreachable, with the reason; it is never replaced
# by another profile.

default: local-7b

profiles:
  - name: local-7b
    label: "Local — qwen2.5-coder 7B (host GPU)"
    client_type: ollama
    base_url: http://localhost:11434
    base_url_env: OLLAMA_BASE_URL        # .env overrides (e.g. host.docker.internal)
    model: qwen2.5-coder:7b
    # The version the local numbers were measured under (bench/environment.yaml
    # carried this globally until profiles; it now belongs to the backend).
    # RE-PINNED 0.35.1 -> 0.40.7 -> 0.40.8 on 2026-10-22 (two deliberate decisions): the host
    # drifted and the gate refused before it produced a number. Run C (7/120)
    # was measured on 0.35.1; runs E and F on 0.40.8 (report-notes.md).
    expected_server_version: "0.40.8"
    determinism:
      reset_strategy: per_run            # unload the model before every run (F28)
      temperature: 0.0                   # pinned, never inherited (F15)
      num_ctx: 16384                     # pinned, never inherited (D10b)

  # Scale control: identical to local-7b in every field but the model (same re-pin).
  - name: local-1.5b
    label: "Local — qwen2.5-coder 1.5B (host GPU)"
    client_type: ollama
    base_url: http://localhost:11434
    base_url_env: OLLAMA_BASE_URL
    model: qwen2.5-coder:1.5b
    expected_server_version: "0.40.8"
    determinism:
      reset_strategy: per_run
      temperature: 0.0
      num_ctx: 16384

  - name: runpod-30b
    label: "RunPod — qwen3-coder 30B (rented GPU, via SSH tunnel)"
    client_type: ollama
    base_url: http://localhost:11435     # the SSH tunnel to the pod's Ollama
    base_url_env: RUNPOD_OLLAMA_BASE_URL
    model: qwen3-coder:30b
    expected_server_version: "0.34.4"    # pinned in the pod (scripts/runpod_arm.py)
    determinism:
      reset_strategy: per_run
      temperature: 0.0
      num_ctx: 16384
    setup_hint: >-
      Needs the RunPod pod AND the SSH tunnel to be already up. This app does
      not start, stop or provision pods and does not manage billing.

  # An OpenAI-compatible frontier API is CONFIGURATION ONLY — no code. Uncomment
  # and set the variable named by credential_env in .env:
  #
  # - name: frontier-openai
  #   label: "OpenAI-compatible — frontier model"
  #   client_type: openai_compatible
  #   base_url: https://api.openai.com/v1
  #   model: gpt-6-luna
  #   credential_env: OPENAI_API_KEY
  #   determinism: {reset_strategy: none, temperature: null, num_ctx: null}
  #   pricing_usd_per_mtok: [0.10, 0.50]  # optional; cost is 0 when omitted

  # The 7B under the SAME decoding configuration as F-prime: identical to local-7b in every
  # field but the two below. Added 2026-10-27 so that the bar a penalty-enabled distilled 1.5B
  # must beat is measured with the same sampling parameters (runs E and G, without the penalty,
  # stay untouched as the config-matched scale comparison against F). Registered prediction:
  # 3 to 8 of 120 (distill-pilot-families.md).
  - name: local-7b-rp
    label: "Local — qwen2.5-coder 7B + repetition penalty 1.1 (host GPU)"
    client_type: ollama
    base_url: http://localhost:11434
    base_url_env: OLLAMA_BASE_URL
    model: qwen2.5-coder:7b
    expected_server_version: "0.40.8"
    determinism:
      reset_strategy: per_run
      temperature: 0.0
      num_ctx: 16384
      repeat_penalty: 1.1
      repeat_last_n: 64

  # F-prime: the 1.5B with a repetition penalty. Identical to local-1.5b in every field but
  # the two below (same model, server pin, temperature, num_ctx, reset strategy).
  #
  # Why (2026-10-27): in run F, 51 of the 77 failures that repeated one error in all five
  # attempts were a generation that degenerated into repetition until the 4,096-token cap and
  # never closed its code fence (mean 21,055 output tokens per run against 2,239). Ollama 0.40.8
  # sends NO repetition penalty by default (an unsent repeat_penalty gave output identical to an
  # explicit 1.0 and different from an explicit 1.1), so that mode was a decoding artefact of an
  # inherited default. A repetition penalty is a deterministic transform of the logits from the
  # generated prefix: temperature 0 stays reproducible. It is part of the model's identity, so
  # this is a NEW profile and a new cache key; F stays as it is, the config-matched comparison
  # against E.
  #
  # Value 1.1, chosen on a VALIDATION set of 80 statements that are not test tasks (the pilot
  # statements; the bare generator prompt), by a rule fixed before 1.2 and 1.3 were seen:
  # the smallest penalty that maximises the number of executed programs. Measured (1.5B, cap
  # 4,096): penalty 1.0: 15/80 hit the cap, 5/80 executed; 1.1: 2/80, 56/80; 1.2: 1/80, 30/80;
  # 1.3: 2/80, 10/80. repeat_last_n is pinned at the server default (64) so that it is not
  # inherited either.
  - name: local-1.5b-rp
    label: "Local — qwen2.5-coder 1.5B + repetition penalty 1.1 (F-prime)"
    client_type: ollama
    base_url: http://localhost:11434
    base_url_env: OLLAMA_BASE_URL
    model: qwen2.5-coder:1.5b
    # Re-pinned 0.40.8 -> 0.40.15 on 2026-11-12 (the host drifted: 0.40.12, then 0.40.15) so the
    # distillation training set is built on the server that will serve the student. Benchmark
    # runs stamped 0.40.8 are NOT directly comparable with runs under this pin.
    expected_server_version: "0.40.15"
    determinism:
      reset_strategy: per_run
      temperature: 0.0
      num_ctx: 16384
      repeat_penalty: 1.1
      repeat_last_n: 64

  - name: local-1.5b-ft-v1
    label: "Local — qwen2.5-coder 1.5B QLoRA ft-v1 (q4_K_M)"
    client_type: ollama
    base_url: http://localhost:11434
    base_url_env: OLLAMA_BASE_URL
    # The tuned student (runs/ft-v1/adapter-best, val_loss 0.2622). Its identity is the DIGEST in
    # runs/ft-v1/serve-manifest.json (998a635fa129...), not this name. Created on 0.40.15, the pin of
    # local-1.5b-rp, whose prompts it was trained on; determinism mirrors that profile.
    model: qwen2.5-coder-ft:1.5b-v1
    expected_server_version: "0.40.15"
    determinism:
      reset_strategy: per_run
      temperature: 0.0
      num_ctx: 16384
      repeat_penalty: 1.1
      repeat_last_n: 64

  # TEACHER for the distillation dataset. Never shown in the UI, never run on
  # the suite (the loaders refuse a non-generator role). Held to a stricter
  # schema than a generator: the distillation guarantee, a DATED SNAPSHOT as the
  # model id, and a stated reasoning effort.
  #
  # Why the dated snapshot (2026-10-24): a floating alias such as
  # deepseek-v4.1-flash, or anything named "latest", can be repointed while a
  # generation is running and the dataset would silently hold two teachers. There
  # is no server build to gate on a hosted API, so the dated id is the only pin
  # available (the Ollama auto-update lesson, in a place with no gate).
  #
  # Why reasoning_effort is fixed here: the hosted default is thinking at "high";
  # it is stated, not inherited, because effort is part of the teacher's identity.
  # It goes into the cache key and into every example's provenance, and is never
  # varied within a dataset version. Changing it starts a NEW dataset version.
  - name: teacher-deepseek-v4.1-flash-1017
    label: "Teacher — deepseek-v4.1-flash-1017 via OpenRouter (distillable only)"
    client_type: openai_compatible
    base_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v4.1-flash-1017
    credential_env: OPENROUTER_API_KEY
    role: teacher
    provider_options:
      enforce_distillable_text: true
    reasoning_effort: high
    # Reasoning tokens share the completion budget. 12000 was too little at effort
    # high on the energy family (one pilot-v1 response used 16,096 tokens, all
    # reasoning, and had no visible text): raised to about twice the observed maximum.
    # Part of the identity (it is in the cache key), so pilot-v1 is a different teacher
    # configuration; truncations stay visible as truncated:finish_reason_length.
    max_tokens_headroom: 32000
    # Sampling pinned to the vendor-recommended values (the model README: temperature
    # 1.0, top_p 1.0) and SENT, for identity rather than quality: an unsent
    # parameter means the provider's default applies, and that can change without
    # notice. Not lowered: what is distilled is the teacher's behaviour in the
    # distribution it was tuned for.
    determinism: {reset_strategy: none, temperature: 1.0, top_p: 1.0, num_ctx: null}
    # No pricing here: the price is time-varying (peak/off-peak), so cost comes
    # from usage.cost per call; see qcagent/distill/spend.py.
