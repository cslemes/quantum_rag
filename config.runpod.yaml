# RunPod arm (T114 subset, seed 1): qwen3-coder:30b on a rented 24 GB GPU, reached through an SSH tunnel to an Ollama bound to localhost in the pod. Generation remote, verification local; reset_per_run and the protocol canary apply (our server).
# The same 16-task subset as S0-S3 and the API arms (T114; report-notes.md,
# "PREDIÇÃO REGISTRADA — braço RunPod"). Two strata, chosen from run 99960870239e97e7:
#   Stratum A — errors taught by the 2.x corpus (F24)
#   Stratum B — invented symbols only (F25); control for S0->S1
model: qwen3-coder:30b
provider: ollama
seeds: [1]
tasks:
  # A
  - dj_constant_4q
  - dj_constant_4q_perturbed
  - dj_balanced_4q
  - simon_6q_perturbed
  - grover_3q
  - grover_4q
  - ising_weighted_maxcut_4q
  - ising_field_coupling_4q_perturbed
  # B
  - bell_phi_plus_2q
  - ghz_5q
  - qft_5q
  - w_state_5q
  - qpe_4q
  - bv_4q
  - reversible_half_adder_4q
  - qaoa_maxcut_4q_perturbed
max_iter: 5
results_dir: results

# Same OllamaClient, prompts, temperature 0, num_ctx and num_predict as the
# local qwen arm; Ollama 0.34.4 pinned in the pod. Only the model and the GPU
# change. The server is ours, so reset_per_run and the protocol canary apply
# (defaults), which makes this arm reproducible, unlike the API arms.
reset_per_run: true
ollama_base_url: http://localhost:11435
generator_host: "runpod:NVIDIA RTX A5000 (EU-SE-1, secure, $0.27/h, pod 75qrd0lpj570r1)"
